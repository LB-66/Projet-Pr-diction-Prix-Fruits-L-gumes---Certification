name: CI/CD - Tests et Deploy Staging

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:

  # ── JOB 1 : Intégration Continue (CI) ──
  tests:
    name: Tests Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Telecharger le code
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preparer le modele factice pour les tests
        run: |
          mkdir -p NOTEBOOKS/models
          python - <<'EOF'
          import joblib, json, numpy as np
          from sklearn.ensemble import GradientBoostingRegressor
          X = np.random.rand(50, 12)
          y = np.random.rand(50)
          m = GradientBoostingRegressor(n_estimators=5, random_state=42)
          m.fit(X, y)
          joblib.dump(m, 'NOTEBOOKS/models/xgboost_fruits_legumes.pkl')
          features = {"features": ["prix_detail","rendement","taille_cup","forme_encoded","categorie_encoded","annee","production_lbs","temp_moyenne","jours_gel","prix_diesel","prix_electricite","urea"]}
          with open('NOTEBOOKS/models/features.json', 'w') as f:
              json.dump(features, f)
          print("Modele CI cree")
          EOF

      - name: Lancer les tests Pytest
        run: |
          pytest tests/ -v --cov=API --cov-report=term-missing

  # ── JOB 2 : Déploiement Staging (CD) ──
  # Se déclenche UNIQUEMENT si les tests passent
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Telecharger le code
        uses: actions/checkout@v4

      - name: Preparer le modele pour le build Docker
        run: |
          mkdir -p NOTEBOOKS/models
          python3 - <<'EOF'
          import joblib, json, numpy as np
          from sklearn.ensemble import GradientBoostingRegressor
          X = np.random.rand(50, 12)
          y = np.random.rand(50)
          m = GradientBoostingRegressor(n_estimators=5, random_state=42)
          m.fit(X, y)
          joblib.dump(m, 'NOTEBOOKS/models/xgboost_fruits_legumes.pkl')
          features = {"features": ["prix_detail","rendement","taille_cup","forme_encoded","categorie_encoded","annee","production_lbs","temp_moyenne","jours_gel","prix_diesel","prix_electricite","urea"]}
          with open('NOTEBOOKS/models/features.json', 'w') as f:
              json.dump(features, f)
          print("Modele staging cree")
          EOF

      - name: Installer Python pour le build
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer pip
        run: python -m pip install --upgrade pip

      - name: Build image Docker API staging
        run: |
          docker build -f Dockerfile.api.staging -t fruits_api_staging:latest .
          echo "Image API staging buildee avec succes"

      - name: Build image Docker Streamlit staging
        run: |
          docker build -f Dockerfile.streamlit.staging -t fruits_streamlit_staging:latest .
          echo "Image Streamlit staging buildee avec succes"

      - name: Verifier les images Docker
        run: |
          docker images | grep fruits
          echo "Deploy staging termine - images prets pour le deploiement"

      - name: Resume du deploiement
        run: |
          echo "========================================="
          echo "DEPLOY STAGING TERMINE AVEC SUCCES"
          echo "========================================="
          echo "Image API      : fruits_api_staging:latest"
          echo "Image Streamlit: fruits_streamlit_staging:latest"
          echo "Commande locale: docker run -p 8000:8000 fruits_api_staging"
          echo "========================================="